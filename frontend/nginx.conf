server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    proxy_set_header Host $http_host;

    location = /api/status {
        proxy_pass http://backend:8080;
    }

    location /api/ {
        proxy_pass http://backend:8080/;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
