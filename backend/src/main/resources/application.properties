spring.application.name=hackathon
# Run from backend/. CI supplies environment variables instead of this optional file.
spring.config.import=optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hackathon}
spring.datasource.username=${POSTGRES_USER:hackathon}
spring.datasource.password=${POSTGRES_PASSWORD:hackathon_dev}
spring.jpa.open-in-view=false
# Disposable prototype DB: replace with coordinated migrations if needed later.
spring.jpa.hibernate.ddl-auto=update
