spring.application.name=hackathon
# Load the root .env when launched from backend/ or from the repository root.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hackathon}?currentSchema=${WISEEASE_DB_SCHEMA:wiseease}
spring.datasource.username=${POSTGRES_USER:hackathon}
spring.datasource.password=${POSTGRES_PASSWORD:hackathon_dev}
spring.jpa.open-in-view=false
spring.flyway.default-schema=${WISEEASE_DB_SCHEMA:wiseease}
spring.flyway.placeholders.wiseeasedemoenabled=${wiseease.demo.enabled:${WISEEASE_DEMO_ENABLED:false}}
spring.jpa.hibernate.ddl-auto=validate
